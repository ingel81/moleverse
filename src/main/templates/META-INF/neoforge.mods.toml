# Mod metadata for the FML mod loader.
# This file is a template: every placeholder is filled at build time from
# gradle.properties (see the "generateModMetadata" task in build.gradle).
# Never edit the generated copy under build/.
#
# Note: a literal dollar-brace construct anywhere in this file - comments
# included - is evaluated as a Groovy expression by Gradle's expand() and will
# break the build unless it names an actual property.

# modLoader and loaderVersion are deliberately omitted: loaderVersion refers to
# the version of the javafml language loader (currently 10.0), NOT to the
# NeoForge version. Without them the defaults matching the NeoForge version in
# use apply. The official MDK omits them for the same reason.
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="${mod_homepage}"
    logoFile="${mod_logo_file}"
    authors="${mod_authors}"
    credits="${mod_credits}"
    description='''
${mod_description}
'''

# --- Dependencies ---------------------------------------------------------
# type: required | optional | incompatible | discouraged
# ordering: NONE | BEFORE | AFTER   (load order relative to the dependency)
# side: BOTH | CLIENT | SERVER

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

