# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
# Decompiling and remapping Minecraft is memory hungry; 1G is not enough.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Toolchain / platform
# Single source of truth for all versions. Porting to a newer Minecraft
# version should ideally only touch this block.
# Current NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
# Minecraft versions accepted at runtime (upper bound exclusive).
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.45
neo_version_range=[21.11.45,22)

# Parchment supplies readable parameter names and javadoc for Minecraft code.
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# ---------------------------------------------------------------------------
# Mod metadata
# Non-ASCII characters must be written as \uXXXX escapes - this file is read
# as ISO-8859-1.
# ---------------------------------------------------------------------------
# Must match the regex [a-z][a-z0-9_]{1,63} and equal Moleverse.MOD_ID.
mod_id=moleverse
mod_name=Moleverse
mod_version=0.1.0
mod_license=LGPL-3.0-or-later
mod_authors=ingel81
mod_description=Moles, their tunnels, and a world beneath the world.
mod_credits=
mod_homepage=https://github.com/ingel81/moleverse
mod_issue_tracker=https://github.com/ingel81/moleverse/issues
mod_logo_file=moleverse_logo.png

# Only relevant when publishing to a Maven repository.
mod_group_id=net.sgeht

# ---------------------------------------------------------------------------
# Development environment: quality-of-life mods that only run in
# runClient/runServer. They are not shipped in the jar and do not appear as
# dependencies in the mod metadata.
# ---------------------------------------------------------------------------
jei_version=27.30.0.85
# Modrinth version id of Jade (Jade 21.1.7 for 1.21.11 / NeoForge)
jade_version_id=LDFqgwEA
# FTB Library, Ultimine and Essentials. FTB numbers its builds after the
# Minecraft version: 2111.x targets 1.21.11.
ftb_version=2111.1.1

# Dev-runtime comfort mods (Modrinth version ids, like jade)
mousetweaks_version_id=bSiQNj2W
xaeros_minimap_version_id=ijlOlFLF
