# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
# Das Dekompilieren/Remappen von Minecraft ist speicherhungrig; 1G reicht nicht.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Toolchain / Plattform
# Zentrale Stelle fuer alle Versionen. Ein Port auf eine neuere Minecraft-
# Version aendert idealerweise nur diesen Block.
# Aktuelle NeoForge-Versionen: https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
# Erlaubte Minecraft-Versionen zur Laufzeit (obere Grenze exklusiv).
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.45
neo_version_range=[21.11.45,22)

# Parchment liefert lesbare Parameternamen + Javadoc fuer Minecraft-Code.
# Versionen: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# ---------------------------------------------------------------------------
# Mod-Metadaten
# ---------------------------------------------------------------------------
# Muss dem Regex [a-z][a-z0-9_]{1,63} genuegen und mit Moleverse.MOD_ID uebereinstimmen.
mod_id=moleverse
mod_name=Moleverse
mod_version=0.1.0
mod_license=LGPL-3.0-or-later
mod_authors=ingel81
# Nicht-ASCII in .properties nur als \uXXXX - die Datei wird als ISO-8859-1 gelesen.
mod_description=Maulw\u00fcrfe, ihre Tunnel und eine eigene Welt unter der Welt.
mod_credits=
mod_homepage=https://github.com/ingel81/moleverse
mod_issue_tracker=https://github.com/ingel81/moleverse/issues
mod_logo_file=moleverse_logo.png

# Nur relevant beim Publish in ein Maven-Repository.
mod_group_id=net.sgeht

# ---------------------------------------------------------------------------
# Dev-Umgebung: QoL-Mods, die nur im runClient/runServer mitlaufen.
# Landen NICHT im ausgelieferten JAR und nicht als Dependency in den Metadaten.
# ---------------------------------------------------------------------------
jei_version=27.30.0.85
# Modrinth-Version-ID von Jade (Jade 21.1.7 fuer 1.21.11 / NeoForge)
jade_version_id=LDFqgwEA
